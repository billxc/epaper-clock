name: Pages (docs and verified app)
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/firmware_manifest.py', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Firmware]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
# The sole Pages publisher, including manual deployment. Do not cancel a live
# deployment; a later invocation re-resolves latest docs and successful build.
# Repository Pages Source must be GitHub Actions, not legacy main:/docs.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main docs, not the completed build's old docs
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve latest successful main Firmware package
        id: firmware
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id:'firmware.yml', branch:'main', status:'success', per_page:100
            });
            const run = runs.filter(r => r.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              ['push','workflow_dispatch'].includes(r.event)).sort((a,b) => b.run_number-a.run_number)[0];
            if (!run) throw new Error('No successful main Firmware run; keep existing Pages deployment');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id:run.id, filter:'latest', per_page:100
            });
            if (!['checks','build'].every(name => jobs.some(j => j.name === name && j.conclusion === 'success')))
              throw new Error('Firmware checks and SDK build must both succeed');
            core.setOutput('run_id', String(run.id));
            core.setOutput('commit', run.head_sha);
      - name: Download same-run SDK app package
        uses: actions/download-artifact@v4
        with:
          name: epaper-clock-firmware
          path: firmware-package
          run-id: ${{ steps.firmware.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble fresh docs and app-only release
        env:
          FIRMWARE_COMMIT: ${{ steps.firmware.outputs.commit }}
        run: |
          mkdir _site
          cp -a docs/. _site/
          python3 tools/firmware_manifest.py --app firmware-package/epaper-clock.bin --commit "$FIRMWARE_COMMIT" --site _site --licenses firmware-package/licenses
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy atomic Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
