name: Firmware
on:
  push:
    branches: [main]
    paths: ['main/**', 'components/**', 'CMakeLists.txt', 'sdkconfig.defaults', 'partitions.csv', 'docs/*.mjs', 'docs/index.html', 'tests/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protocol and menu tests
        run: |
          node --test docs/*.test.mjs
          cc -std=c11 -Wall -Wextra -Werror -Imain tests/menu_test.c main/menu_model.c -o /tmp/menu-test
          /tmp/menu-test
          cc -std=c11 -Wall -Wextra -Werror -Itests/app_ui_stubs -Imain -Icomponents/epaper_port tests/app_ui_test.c main/app_ui.c main/menu_model.c main/render_mode.c -o /tmp/app-ui-test
          /tmp/app-ui-test
          cc -std=gnu11 -Wall -Wextra -Werror -Itests/lan_password_stubs -Imain tests/lan_password_test.c -o /tmp/lan-password-test
          /tmp/lan-password-test
          cc -std=c11 -Wall -Wextra -Werror -pthread -Itests/power_settings_stubs tests/power_settings_test.c -o /tmp/power-settings-test
          /tmp/power-settings-test
          cc -std=c11 -Wall -Wextra -Werror -Itests/power_runtime_stubs -Itests/app_ui_stubs -Imain -Icomponents/axpPower -Icomponents/epaper_port tests/power_runtime_test.c main/power_runtime.c -o /tmp/power-runtime-test
          /tmp/power-runtime-test
          cc -std=c11 -Wall -Wextra -Werror -Itests/app_ui_stubs -Imain -Icomponents/epaper_port tests/power_wake_ui_test.c main/app_ui.c main/menu_model.c main/render_mode.c -o /tmp/power-wake-ui-test
          /tmp/power-wake-ui-test
          cc -std=c11 -Wall -Wextra -Werror -Itests/poweroff_stubs -Itests/power_runtime_stubs -Itests/app_ui_stubs -Imain -Icomponents/axpPower -Icomponents/epaper_port tests/poweroff_test.c main/poweroff.c main/app_ui.c main/menu_model.c main/render_mode.c -o /tmp/poweroff-test
          /tmp/poweroff-test
          c++ -std=c++17 -Wall -Wextra -Werror -Wno-error=return-type -Itests/poweroff_stubs -Itests/app_ui_stubs -Icomponents/axpPower -Icomponents/axpPower/src -Icomponents/i2c_bsp tests/poweroff_axp_test.cpp components/axpPower/axp_prot.cpp components/axpPower/src/XPowersLibInterface.cpp -o /tmp/poweroff-axp-test
          /tmp/poweroff-axp-test
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -Wall -Wextra -Werror -Itests/poweroff_stubs -Itests/app_ui_stubs -Imain -Icomponents/i2c_bsp tests/poweroff_rtc_test.c main/rtc.c -o /tmp/poweroff-rtc-test
          /tmp/poweroff-rtc-test
          cc -std=gnu11 -Wall -Wextra -Werror -Imain tests/clock_refresh_test.c -o /tmp/clock-refresh-test
          /tmp/clock-refresh-test
          cc -std=c11 -Wall -Wextra -Werror -Icomponents/epaper_port tests/frame_codec_test.c components/epaper_port/frame_codec.c -o /tmp/frame-codec-test
          /tmp/frame-codec-test
          cc -std=c11 -Wall -Wextra -Werror -Imain tests/display_test.c main/display.c main/ui_font.c main/clock_font.c main/render_mode.c -lm -o /tmp/display-test
          mkdir -p /tmp/ui-preview
          /tmp/display-test /tmp/ui-preview
      - name: Real FatFs exFAT image tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends exfatprogs
          mkdir -p /tmp/fatfs-sdk/src
          for source in ff.c ff.h ffconf.h ffunicode.c diskio.h; do
            curl --fail --location --retry 2 "https://raw.githubusercontent.com/espressif/esp-idf/v5.5.2/components/fatfs/src/$source" -o "/tmp/fatfs-sdk/src/$source"
          done
          cc -std=c11 -O2 -Wall -Wextra -Werror -include tests/fatfs_host_config.h -I/tmp/fatfs-sdk/src -Icomponents/sdcard_bsp tests/fat_frame_cache_test.c components/sdcard_bsp/fat_frame_cache.c /tmp/fatfs-sdk/src/ff.c /tmp/fatfs-sdk/src/ffunicode.c -o /tmp/fat-frame-cache-test
          python3 tests/fat_frame_cache_image_test.py /tmp/fat-frame-cache-test
          cc -std=c11 -Wall -Wextra -Werror -include tests/fatfs_host_config.h -I/tmp/fatfs-sdk/src -Icomponents/sdcard_bsp tests/fat_frame_cache_state_test.c -o /tmp/fat-cache-state-test
          /tmp/fat-cache-state-test
          for dynamic in 0 1; do
            cc -std=c11 -O2 -Wall -Wextra -Werror -DFF_USE_DYN_BUFFER=$dynamic -include tests/fatfs_host_config.h -Itests/sdcard_stubs -I/tmp/fatfs-sdk/src -Icomponents/sdcard_bsp tests/sdcard_lifecycle_test.c components/sdcard_bsp/sdcard_bsp.c components/sdcard_bsp/fat_frame_cache.c /tmp/fatfs-sdk/src/ff.c /tmp/fatfs-sdk/src/ffunicode.c -o /tmp/sd-lifecycle-test
            python3 tests/sdcard_lifecycle_image_test.py /tmp/fat-frame-cache-test /tmp/sd-lifecycle-test
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ui-render-preview
          path: |
            /tmp/ui-preview/*.pbm
            /tmp/ui-preview/*.pgm
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o "$PWD/build/epaper-clock-factory.bin"
          python tools/package_licenses.py
          cp partitions.csv build/partitions.csv
          mkdir -p build/sd-cache
          cp docs/sd-cache.md build/sd-cache/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: epaper-clock-firmware
          path: |
            build/epaper-clock.bin
            build/epaper-clock-factory.bin
            build/ota_data_initial.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/partitions.csv
            build/flasher_args.json
            build/flash_args
            build/licenses/**
            build/sd-cache/**
