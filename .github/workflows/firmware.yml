name: Firmware
on:
  push:
    branches: [main]
    paths: ['main/**', 'components/**', 'CMakeLists.txt', 'sdkconfig.defaults', 'partitions.csv', 'docs/*.mjs', 'docs/index.html', 'tests/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protocol and menu tests
        run: |
          node --test docs/*.test.mjs
          cc -std=c11 -Wall -Wextra -Werror -Imain tests/menu_test.c main/menu_model.c -o /tmp/menu-test
          /tmp/menu-test
          cc -std=c11 -Wall -Wextra -Werror -Icomponents/epaper_port tests/frame_codec_test.c components/epaper_port/frame_codec.c -o /tmp/frame-codec-test
          /tmp/frame-codec-test
          cc -std=c11 -Wall -Wextra -Werror -Imain tests/display_test.c main/display.c main/ui_font.c main/clock_font.c main/render_mode.c -lm -o /tmp/display-test
          mkdir -p /tmp/ui-preview
          /tmp/display-test /tmp/ui-preview
      - name: Real FatFs exFAT image tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends exfatprogs
          mkdir -p /tmp/fatfs-sdk/src /tmp/fatfs-sdk/diskio
          for source in ff.c ff.h ffconf.h ffunicode.c; do
            curl --fail --location --retry 2 "https://raw.githubusercontent.com/espressif/esp-idf/v5.5.2/components/fatfs/src/$source" -o "/tmp/fatfs-sdk/src/$source"
          done
          curl --fail --location --retry 2 https://raw.githubusercontent.com/espressif/esp-idf/v5.5.2/components/fatfs/diskio/diskio.h -o /tmp/fatfs-sdk/diskio/diskio.h
          cc -std=c11 -O2 -Wall -Wextra -Werror -include tests/fatfs_host_config.h -I/tmp/fatfs-sdk/src -I/tmp/fatfs-sdk/diskio -Icomponents/sdcard_bsp tests/fat_frame_cache_test.c components/sdcard_bsp/fat_frame_cache.c /tmp/fatfs-sdk/src/ff.c /tmp/fatfs-sdk/src/ffunicode.c -o /tmp/fat-frame-cache-test
          python3 tests/fat_frame_cache_image_test.py /tmp/fat-frame-cache-test
      - uses: actions/upload-artifact@v4
        with:
          name: ui-render-preview
          path: |
            /tmp/ui-preview/*.pbm
            /tmp/ui-preview/*.pgm
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o "$PWD/build/epaper-clock-factory.bin"
          python tools/package_licenses.py
          cp partitions.csv build/partitions.csv
          mkdir -p build/sd-cache
          cp docs/sd-cache.md build/sd-cache/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: epaper-clock-firmware
          path: |
            build/epaper-clock.bin
            build/epaper-clock-factory.bin
            build/ota_data_initial.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/partitions.csv
            build/flasher_args.json
            build/flash_args
            build/licenses/**
            build/sd-cache/**
