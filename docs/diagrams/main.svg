<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">MAIN · 冷启动、用户服务与分钟循环</title>
  <desc id="svg-desc">当前实现（基线524453e），非新增固件FSM。未实机验证。实线仅为当前转换；未实现行为仅列于注记。</desc>
