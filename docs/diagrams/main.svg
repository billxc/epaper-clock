    <text x="800.0" y="612.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">跳过 / 成功 / 失败</text>
  </g>
  <g id="edge_6_label">
    <rect x="695" y="774" width="210" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="800.0" y="790.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">检查当前分钟</text>
  </g>
  <g id="edge_7_label">
    <rect x="437" y="748" width="106" height="54" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="490.0" y="764.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">是</text>
    <text x="490.0" y="786.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">立即补刷</text>
  </g>
  <g id="edge_8_label">
    <rect x="473" y="934" width="185" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="565.5" y="950.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">否 · 电池供电</text>
  </g>
  <g id="edge_9_label">
    <rect x="940" y="934" width="180" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1030.0" y="950.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">否 · USB供电</text>
  </g>
  <g id="edge_10_label">
    <rect x="170" y="159" width="270" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="305.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">RTC / PWR → 冷启动</text>
  </g>
  <g id="edge_11_label">
    <rect x="1035" y="813" width="230" height="54" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1150.0" y="829.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">整分到达</text>
    <text x="1150.0" y="851.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">先采样按键 / 每日检查</text>
  </g>
  <g id="edge_12_label">
    <rect x="1375" y="224" width="130" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
