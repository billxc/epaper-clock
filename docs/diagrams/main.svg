  <g id="boot">
    <rect x="590" y="125" width="420" height="100" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="800.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">Boot / 初始化</text>
    <text x="800.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">先读 RTC AF，再清标志</text>
    <text x="800.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">USB：额外 ≤10s 串口校时窗口</text>
  </g>
  <g id="route">
    <rect x="590" y="290" width="420" height="100" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="800.0" y="315.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">启动路由</text>
    <text x="800.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">AF=0（非RTC启动）或中键GPIO5</text>
    <text x="800.0" y="365.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">或上键GPIO4 → 用户服务</text>
  </g>
  <g id="service">
    <rect x="1140" y="300" width="380" height="205" rx="10" fill="#f3ecfa" stroke="#8054a6" stroke-width="1.8" />
    <text x="1330.0" y="342.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">用户服务 · 详见 BLE / LAN 图</text>
    <text x="1330.0" y="366.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">上键 / 无保存SSID → BLE</text>
    <text x="1330.0" y="390.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">否则 → STA HTTP</text>
    <text x="1330.0" y="414.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">BLE失败 → 结束服务、回时钟</text>
    <text x="1330.0" y="438.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">BLE保存成功 → 先尝试NTP</text>
    <text x="1330.0" y="462.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">NTP失败也继续 → STA HTTP</text>
  </g>
  <g id="daily">
    <rect x="590" y="480" width="420" height="90" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="800.0" y="512.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">每日自动校时检查</text>
    <text x="800.0" y="537.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">条件 / 当天尝试锁定：详见 NTP 图</text>
  </g>
  <g id="refresh">
    <rect x="590" y="655" width="420" height="100" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="800.0" y="669.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">采样 → 刷屏 → 更新缓存</text>
    <text x="800.0" y="693.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">EPD_Init → ALDO3 3.3V开</text>
    <text x="800.0" y="717.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">刷完 EPD_Sleep → ALDO3关</text>
    <text x="800.0" y="741.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">校时成功可请求强制全刷</text>
  </g>
  <g id="boundary">
    <rect x="590" y="825" width="420" height="80" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="800.0" y="852.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">本轮处理是否已跨整分？</text>
    <text x="800.0" y="877.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">是：立即再次每日检查 / 补刷</text>
  </g>
  <g id="off">
    <rect x="250" y="995" width="400" height="100" rx="10" fill="#f0f2f5" stroke="#647080" stroke-width="1.8" />
    <text x="450.0" y="1021.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">电池：设下分钟 RTC → PMU关机</text>
    <text x="450.0" y="1045.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">WiFi / HTTP / BLE 均关闭</text>
    <text x="450.0" y="1069.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">等待 RTC / PWR 冷启动</text>
  </g>
  <g id="usb">
    <rect x="950" y="995" width="400" height="100" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="1150.0" y="1021.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">USB：时钟等待整分</text>
    <text x="1150.0" y="1045.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">每50ms查键；整分到达后更新</text>
    <text x="1150.0" y="1069.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">WiFi / HTTP / BLE 均关闭</text>
  </g>
  <g id="missing">
    <rect x="85" y="345" width="350" height="140" rx="10" fill="#fff0ee" stroke="#b73838" stroke-width="1.8" />
    <text x="260.0" y="379.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">尚未实现（不是转换）</text>
    <text x="260.0" y="403.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">常驻LAN / WiFi掉线重连</text>
    <text x="260.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">LAN失败屏幕提示仍欠缺</text>
    <text x="260.0" y="451.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">不得据此理解为自动热点</text>
  </g>
  <g id="clock_note">
    <rect x="85" y="620" width="350" height="110" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="260.0" y="639.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">屏幕断电仍保留画面</text>
    <text x="260.0" y="663.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">USB / HTTP / BLE等待：屏幕电源关</text>
    <text x="260.0" y="687.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">屏幕断电 ≠ PMU整机关机</text>
    <text x="260.0" y="711.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">可与LAN常驻共存（但尚未实现）</text>
  </g>
