    <text x="1075.0" y="319.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">用户触发</text>
