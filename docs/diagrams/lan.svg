<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">LAN · 临时 STA HTTP 管理窗口</title>
  <desc id="svg-desc">当前实现（基线524453e），非新增固件FSM。未实机验证。实线仅为当前转换；未实现行为仅列于注记。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#287747" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b73838" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8054a6" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#647080" />
    </marker>
  </defs>
  <rect width="1600" height="1160" fill="#ffffff" />
  <path d="M 45 100 H 1555" stroke="#dbe2ea" fill="none" />
  <polyline id="edge_1" points="500,205 600,205" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_2" points="1030,205 1150,205" fill="none" stroke="#b73838" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)" />
  <polyline id="edge_3" points="815,260 815,420" fill="none" stroke="#287747" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <polyline id="edge_4" points="1500,205 1550,205 1550,1045 460,1045" fill="none" stroke="#b73838" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)" />
  <polyline id="edge_5" points="1030,455 1090,455 1090,375 1330,375 1330,420" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_6" points="1160,525 1030,525" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_7" points="600,455 520,455 520,610 650,610 650,560" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_8" points="815,560 815,740" fill="none" stroke="#b73838" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)" />
  <polyline id="edge_9" points="1330,560 1330,792 1030,792" fill="none" stroke="#b73838" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)" />
  <polyline id="edge_10" points="600,505 485,505 485,690 280,690 280,740" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_11" points="600,792 460,792" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_12" points="280,845 280,990" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <g id="entry">
    <rect x="100" y="150" width="400" height="110" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="300.0" y="192.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">用户服务 / BLE成功后的入口</text>
    <text x="300.0" y="217.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">不是常驻LAN；不自启动热点</text>
  </g>
  <g id="sta">
    <rect x="600" y="150" width="430" height="110" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="815.0" y="192.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">STA 连接 ≤15s</text>
    <text x="815.0" y="217.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">或复用已经连接的STA</text>
  </g>
  <g id="failure">
    <rect x="1150" y="150" width="350" height="110" rx="10" fill="#fff0ee" stroke="#b73838" stroke-width="1.8" />
    <text x="1325.0" y="181.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">连接失败</text>
    <text x="1325.0" y="205.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">记录日志；关闭WiFi</text>
    <text x="1325.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">屏幕失败提示仍欠缺</text>
  </g>
  <g id="http">
    <rect x="600" y="420" width="430" height="140" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="815.0" y="454.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">HTTP 启动 / 活动（临时密码）</text>
    <text x="815.0" y="478.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">GET /api/status：不延长idle</text>
    <text x="815.0" y="502.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">GET / 和 POST：延长idle</text>
    <text x="815.0" y="526.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">提供状态 / 手动NTP / exit</text>
  </g>
  <g id="manual">
    <rect x="1160" y="420" width="340" height="140" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="1330.0" y="466.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">HTTP 手动校时</text>
    <text x="1330.0" y="490.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">内部STA最多15s + NTP≤10s</text>
    <text x="1330.0" y="514.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">成功 / 失败均回HTTP</text>
  </g>
  <g id="offline">
    <rect x="600" y="740" width="430" height="105" rx="10" fill="#fff0ee" stroke="#b73838" stroke-width="1.8" />
    <text x="815.0" y="768.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">WiFi断线 → 网络不可达</text>
    <text x="815.0" y="792.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">HTTP任务仍在；没有自动重连</text>
    <text x="815.0" y="816.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">仍等待原idle / 总时限清理</text>
  </g>
  <g id="cleanup">
    <rect x="100" y="740" width="360" height="105" rx="10" fill="#f0f2f5" stroke="#647080" stroke-width="1.8" />
    <text x="280.0" y="780.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">结束管理窗口</text>
    <text x="280.0" y="805.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">停止HTTP + 关闭WiFi</text>
  </g>
  <g id="clock">
    <rect x="100" y="990" width="360" height="90" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="280.0" y="1022.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">返回时钟调用方</text>
    <text x="280.0" y="1047.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">MAIN：每日检查 → 刷屏</text>
  </g>
  <g id="limits">
    <rect x="80" y="355" width="360" height="120" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="260.0" y="391.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">窗口限额</text>
    <text x="260.0" y="415.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">idle 5min 或总时长15min</text>
    <text x="260.0" y="439.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">POST exit 可提前结束</text>
  </g>
  <g id="offline_note">
    <rect x="1100" y="910" width="400" height="100" rx="10" fill="#fff0ee" stroke="#b73838" stroke-width="1.8" />
    <text x="1300.0" y="948.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="600">未实现：常驻LAN / 掉线自动重连</text>
    <text x="1300.0" y="971.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">不可达不是退出；任务等待限额到期</text>
  </g>
  <g id="edge_1_label">
    <rect x="505" y="164" width="90" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="550.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">进入</text>
  </g>
  <g id="edge_2_label">
    <rect x="1040" y="189" width="100" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1090.0" y="205.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">失败</text>
  </g>
  <g id="edge_3_label">
    <rect x="650" y="313" width="330" height="54" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="815.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">得到IP / 复用连接</text>
    <text x="815.0" y="351.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">每次生成临时HTTP密码</text>
  </g>
  <g id="edge_4_label">
    <rect x="970" y="1029" width="300" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1120.0" y="1045.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">连接失败后直接返回时钟</text>
  </g>
  <g id="edge_5_label">
    <rect x="1155" y="359" width="250" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1280.0" y="375.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">POST 手动NTP</text>
  </g>
  <g id="edge_6_label">
    <rect x="1034" y="509" width="122" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1095.0" y="525.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">成功 / 失败</text>
  </g>
  <g id="edge_7_label">
    <rect x="525" y="594" width="250" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="650.0" y="610.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">GET请求：按节点规则</text>
  </g>
  <g id="edge_8_label">
    <rect x="720" y="634" width="190" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="815.0" y="650.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">WiFi断线</text>
  </g>
  <g id="edge_9_label">
    <rect x="1195" y="634" width="270" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1330.0" y="650.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">若掉线：网络不可达</text>
  </g>
  <g id="edge_10_label">
    <rect x="105" y="638" width="350" height="54" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="280.0" y="654.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">exit / idle 5min / 总15min</text>
    <text x="280.0" y="676.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">或HTTP启动 / 注册失败</text>
  </g>
  <g id="edge_11_label">
    <rect x="466" y="776" width="128" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="530.0" y="792.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">idle / 上限</text>
  </g>
  <g id="edge_12_label">
    <rect x="170" y="902" width="220" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="280.0" y="918.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">无线服务已关闭</text>
  </g>
  <g id="title">
    <text x="45" y="38.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#172b44" font-weight="600">LAN · 临时 STA HTTP 管理窗口</text>
  </g>
  <g id="baseline">
    <text x="45" y="75.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">当前实现（基线524453e），非新增固件FSM</text>
  </g>
  <g id="legend">
    <text x="885" y="41.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">蓝：正常  ·  绿：成功  ·  红：失败</text>
    <text x="885" y="64.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">紫：BLE  ·  灰：关机  |  实线仅表示已实现转换</text>
  </g>
  <g id="footer">
    <text x="45" y="1133.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#172b44" font-weight="400">未实机验证 · 基于已核对代码事实；状态为文档抽象，非应用 enum。各子图入口 / 返回均为调用边界。</text>
  </g>
</svg>
