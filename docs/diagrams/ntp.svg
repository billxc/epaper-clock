<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">NTP · 每日自动校时与当天尝试锁定</title>
  <desc id="svg-desc">当前实现（基线524453e），非新增固件FSM。未实机验证。实线仅为当前转换；未实现行为仅列于注记。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#287747" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b73838" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8054a6" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#647080" />
    </marker>
  </defs>
  <rect width="1600" height="1160" fill="#ffffff" />
  <path d="M 45 100 H 1555" stroke="#dbe2ea" fill="none" />
  <polyline id="edge_1" points="440,205 590,205" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_2" points="590,245 490,245 490,360 270,360 270,420" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_3" points="810,295 810,405" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_4" points="590,455 515,455 515,490 440,490" fill="none" stroke="#b73838" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)" />
  <polyline id="edge_5" points="810,505 810,615" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_6" points="810,705 810,810" fill="none" stroke="#287747" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <polyline id="edge_7" points="1030,660 1550,660 1550,1060 1500,1060" fill="none" stroke="#b73838" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)" />
  <polyline id="edge_8" points="1030,870 1080,870 1080,1060 1130,1060" fill="none" stroke="#b73838" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)" />
  <polyline id="edge_9" points="1030,835 1130,835" fill="none" stroke="#287747" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <polyline id="edge_10" points="1315,920 1315,1020" fill="none" stroke="#287747" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <polyline id="edge_11" points="1130,1060 440,1060" fill="none" stroke="#2563a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <polyline id="edge_12" points="270,540 65,540 65,1055 100,1055" fill="none" stroke="#647080" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-gray)" />
  <g id="entry">
    <rect x="100" y="150" width="340" height="110" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="270.0" y="192.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">每分钟时钟流程进入</text>
    <text x="270.0" y="217.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">MAIN：每日检查调用点</text>
  </g>
  <g id="gate">
    <rect x="590" y="150" width="440" height="145" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="810.0" y="186.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">自动校时条件：必须全部满足</text>
    <text x="810.0" y="210.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">有SSID &amp;&amp; RTC有效</text>
    <text x="810.0" y="234.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">hour ≥ 配置小时 &amp;&amp; 当天未尝试</text>
    <text x="810.0" y="258.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">默认8点；不满足则跳过无线</text>
  </g>
  <g id="skip">
    <rect x="100" y="420" width="340" height="120" rx="10" fill="#f0f2f5" stroke="#647080" stroke-width="1.8" />
    <text x="270.0" y="457.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="600">不联网，直接返回</text>
    <text x="270.0" y="480.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">条件不满足：skip</text>
    <text x="270.0" y="503.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">或 last_attempt_day 保存失败</text>
  </g>
  <g id="record">
    <rect x="590" y="405" width="440" height="100" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="810.0" y="442.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">先写 NVS：last_attempt_day</text>
    <text x="810.0" y="467.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">保存成功才允许联网</text>
  </g>
  <g id="sta">
    <rect x="590" y="615" width="440" height="90" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="810.0" y="647.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">STA连接 ≤15s</text>
    <text x="810.0" y="672.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">失败不重试当天自动校时</text>
  </g>
  <g id="ntp">
    <rect x="590" y="810" width="440" height="90" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="810.0" y="842.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">NTP请求 ≤10s</text>
    <text x="810.0" y="867.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">失败不重试当天自动校时</text>
  </g>
  <g id="success">
    <rect x="1130" y="800" width="370" height="120" rx="10" fill="#e9f6ed" stroke="#287747" stroke-width="1.8" />
    <text x="1315.0" y="836.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">成功：写RTC</text>
    <text x="1315.0" y="860.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">尝试保存 last_sync / 校正后日期</text>
    <text x="1315.0" y="884.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">NVS失败仅告警；仍请求强制全刷</text>
  </g>
  <g id="cleanup">
    <rect x="1130" y="1020" width="370" height="80" rx="10" fill="#f0f2f5" stroke="#647080" stroke-width="1.8" />
    <text x="1315.0" y="1047.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">关闭WiFi</text>
    <text x="1315.0" y="1072.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">自动校时结束</text>
  </g>
  <g id="return">
    <rect x="100" y="1010" width="340" height="90" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="270.0" y="1042.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="600">返回时钟调用方</text>
    <text x="270.0" y="1067.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#172b44" font-weight="400">继续采样 / 刷屏</text>
  </g>
  <g id="invalid_note">
    <rect x="1140" y="150" width="380" height="145" rx="10" fill="#fff0ee" stroke="#b73838" stroke-width="1.8" />
    <text x="1330.0" y="198.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="600">待设计缺口（不是已实现分支）</text>
    <text x="1330.0" y="222.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">RTC无效会一直skip自动校时</text>
    <text x="1330.0" y="246.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">本图不画自动修复 / 强制联网</text>
  </g>
  <g id="attempt_note">
    <rect x="100" y="650" width="340" height="170" rx="10" fill="#eaf2ff" stroke="#2563a8" stroke-width="1.8" />
    <text x="270.0" y="700.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="600">当天尝试锁定</text>
    <text x="270.0" y="723.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">先记录尝试日，再尝试联网</text>
    <text x="270.0" y="746.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">STA / NTP失败：当天不自动再试</text>
    <text x="270.0" y="769.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">手动NTP不走本图每日门槛</text>
  </g>
  <g id="edge_1_label">
    <rect x="445" y="164" width="140" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="515.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">每日检查</text>
  </g>
  <g id="edge_2_label">
    <rect x="195" y="344" width="270" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="330.0" y="360.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">任一条件不满足</text>
  </g>
  <g id="edge_3_label">
    <rect x="705" y="334" width="210" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="810.0" y="350.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">条件全部满足</text>
  </g>
  <g id="edge_4_label">
    <rect x="446" y="474" width="138" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="515.0" y="490.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">NVS保存失败</text>
  </g>
  <g id="edge_5_label">
    <rect x="700" y="544" width="220" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="810.0" y="560.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">NVS保存成功</text>
  </g>
  <g id="edge_6_label">
    <rect x="720" y="741" width="180" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="810.0" y="757.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">连接成功</text>
  </g>
  <g id="edge_7_label">
    <rect x="1160" y="644" width="300" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1310.0" y="660.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">连接失败 / 超时</text>
  </g>
  <g id="edge_8_label">
    <rect x="1005" y="938" width="150" height="54" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1080.0" y="954.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">NTP失败</text>
    <text x="1080.0" y="976.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">/ 超时</text>
  </g>
  <g id="edge_9_label">
    <rect x="1034" y="794" width="92" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1080.0" y="810.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">成功</text>
  </g>
  <g id="edge_10_label">
    <rect x="1190" y="943" width="250" height="54" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="1315.0" y="959.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">RTC已更新</text>
    <text x="1315.0" y="981.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">元数据写失败仅告警</text>
  </g>
  <g id="edge_11_label">
    <rect x="640" y="1044" width="300" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="790.0" y="1060.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">成功或失败均关闭WiFi后返回</text>
  </g>
  <g id="edge_12_label">
    <rect x="110" y="884" width="280" height="32" rx="3" fill="#ffffff" stroke="none" stroke-width="1.8" />
    <text x="250.0" y="900.0" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">不联网；保持时钟流程</text>
  </g>
  <g id="title">
    <text x="45" y="38.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#172b44" font-weight="600">NTP · 每日自动校时与当天尝试锁定</text>
  </g>
  <g id="baseline">
    <text x="45" y="75.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#172b44" font-weight="400">当前实现（基线524453e），非新增固件FSM</text>
  </g>
  <g id="legend">
    <text x="885" y="41.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">蓝：正常  ·  绿：成功  ·  红：失败</text>
    <text x="885" y="64.5" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#172b44" font-weight="400">紫：BLE  ·  灰：关机  |  实线仅表示已实现转换</text>
  </g>
  <g id="footer">
    <text x="45" y="1133.0" text-anchor="start" dominant-baseline="central" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#172b44" font-weight="400">未实机验证 · 基于已核对代码事实；状态为文档抽象，非应用 enum。各子图入口 / 返回均为调用边界。</text>
  </g>
</svg>
